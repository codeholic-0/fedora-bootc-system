# Local ISO build config (legacy bootc-image-builder `iso` / anaconda-iso path)
# Build: sudo podman run ... quay.io/centos-bootc/bootc-image-builder --type iso
#        --config config.toml --local /path/to/<built-testing-image-ref>
# Purpose: VM testing of the testing-tag image; production ISO design waits
# for the image-builder (bootc-generic-iso) migration — see testing/compaction.md.
#
# Kickstart: intentionally minimal. No lang/keyboard/timezone/rootpw lines —
# anaconda-iso handles locale/keyboard interactively and BIB injects user
# handling; the only contract line is the %post bootc switch that replaces the
# installer environment with our published OCI (this is what makes the ISO
# install OUR image instead of the stock base).

[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/codeholic-0/zen-bootc:testing
%end
"""

# Restore the installer screens Anaconda removes in bootc/image-mode installs.
# Storage = partitioning, Users = account/password setup, Timezone = clock UI.
# Subscription is RHEL-only noise. (Reference: iso-kde.toml from the ublue
# template — same list.)
[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone",
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
