name: Build and Push Fedora Bootc

on:
  push:
    branches: [main]
    paths:
      - "Containerfile"
      - "Containerfile.testing"
      - "Containerfile.minimal"
      - "policy.json"
      - ".github/workflows/bootc-publish.yaml"
  # Weekly rebuild: tracks Fedora 45 package/base updates without any commits.
  # 18:05 UTC Saturday (off-peak offset from the hour).
  schedule:
    - cron: "5 18 * * 6"
  workflow_dispatch:
    inputs:
      minimal:
        description: "Build minimal"
        type: boolean
        default: false
      testing:
        description: "Build testing"
        type: boolean
        default: false
      final:
        description: "Build final"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/zen-bootc
  # Distro-agnostic rechunker (coreos/chunkah). Alternative (needs rpm-ostree
  # inside the image): rpm-ostree compose build-chunked-oci --bootc.
  RECHUNK_IMAGE: quay.io/coreos/chunkah:latest

# Cancel superseded runs of this workflow on the same branch to avoid
# burning build+push minutes on outdated commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Scheduled runs always build everything; push/dispatch filter by paths.
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      minimal: ${{ steps.filter.outputs.minimal }}
      testing: ${{ steps.filter.outputs.testing }}
      final: ${{ steps.filter.outputs.final }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Detect changed Containerfiles
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            minimal:
              - 'Containerfile.minimal'
            testing:
              - 'Containerfile.testing'
            final:
              - 'Containerfile'
              - 'policy.json'
              - '.github/workflows/bootc-publish.yaml'

  build-minimal:
    if: needs.changes.outputs.minimal == 'true' || github.event_name == 'schedule' || github.event.inputs.minimal == 'true'
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Maximize build space
        # Rechunking makes a full copy of the image; the ~10GB testing/final
        # images need the runner pruned first (same recipe the ublue templates use).
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        run: |
          IMAGE="${IMAGE,,}"
          echo "${{ secrets.GHCR_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build minimal image
        run: |
          IMAGE="${IMAGE,,}"
          # --pull=newer re-checks the base manifest each build (this is what
          # makes the weekly schedule pick up Fedora package/base updates).
          podman build --pull=newer -f Containerfile.minimal -t "$IMAGE:minimal-latest" .
          # Immutable audit/rollback anchor: testing-<UTC date>-<commit sha7>.
          echo "DTAG=$IMAGE:minimal-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Rechunk image (small delta updates)
        run: |
          set -euox pipefail
          IMAGE="${IMAGE,,}"
          CHUNKAH_CONFIG_FILE="$(mktemp)"
          CHUNKAH_OUTPUT_DIR="$(mktemp -d "${WORKSPACE:-/tmp}"/zen-bootc-chunkah-XXXXXX)"
          podman inspect "$IMAGE:minimal-latest" > "$CHUNKAH_CONFIG_FILE"

          podman run --rm \
            --mount=type=image,src="$IMAGE:minimal-latest",target=/chunkah \
            -v "$CHUNKAH_CONFIG_FILE:/chunkah-config.json:ro,Z" \
            -v "$CHUNKAH_OUTPUT_DIR:/run/out:Z" \
            "$RECHUNK_IMAGE" \
            build \
            --verbose \
            --compressed \
            --max-layers 128 \
            --prune /sysroot/ \
            --label ostree.commit- --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          # Replace the unchunked local tag with the chunked image
          CHUNKED_IMAGE="$(podman pull "oci:${CHUNKAH_OUTPUT_DIR}/chunked")"
          podman untag "$IMAGE:minimal-latest" || true
          podman tag "$CHUNKED_IMAGE" "$IMAGE:minimal-latest" "$DTAG"

      - name: Push minimal image
        run: |
          IMAGE="${IMAGE,,}"
          podman push --digestfile=/tmp/digestfile "$IMAGE:minimal-latest"
          podman push --digestfile=/tmp/digestfile "$DTAG"

      - name: Install Cosign
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Log in to GHCR (docker client, for cosign)
        # cosign uses its own credential chain (~/.docker/config.json), NOT
        # podman's authfile — without this the signature upload gets UNAUTHORIZED.
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sign minimal image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          IMAGE="${IMAGE,,}"
          # Key-based signing is done against the pushed digest, not the tag.
          # Requires the SIGNING_SECRET repo secret (cosign private key).
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$IMAGE@$(cat /tmp/digestfile)"

  build-testing:
    if: needs.changes.outputs.testing == 'true' || github.event_name == 'schedule' || github.event.inputs.testing == 'true'
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        run: |
          IMAGE="${IMAGE,,}"
          echo "${{ secrets.GHCR_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build testing image
        run: |
          IMAGE="${IMAGE,,}"
          # --pull=newer re-checks the base manifest each build (this is what
          # makes the weekly schedule pick up Fedora package/base updates).
          podman build --pull=newer -f Containerfile.testing -t "$IMAGE:testing" .
          # Immutable rollback anchor: testing-<UTC date>-<commit sha7>.
          echo "DTAG=$IMAGE:testing-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Rechunk image (small delta updates)
        run: |
          set -euox pipefail
          IMAGE="${IMAGE,,}"
          CHUNKAH_CONFIG_FILE="$(mktemp)"
          CHUNKAH_OUTPUT_DIR="$(mktemp -d "${WORKSPACE:-/tmp}"/zen-bootc-chunkah-XXXXXX)"
          podman inspect "$IMAGE:testing" > "$CHUNKAH_CONFIG_FILE"

          podman run --rm \
            --mount=type=image,src="$IMAGE:testing",target=/chunkah \
            -v "$CHUNKAH_CONFIG_FILE:/chunkah-config.json:ro,Z" \
            -v "$CHUNKAH_OUTPUT_DIR:/run/out:Z" \
            "$RECHUNK_IMAGE" \
            build \
            --verbose \
            --compressed \
            --max-layers 128 \
            --prune /sysroot/ \
            --label ostree.commit- --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          # Replace the unchunked local tag with the chunked image
          CHUNKED_IMAGE="$(podman pull "oci:${CHUNKAH_OUTPUT_DIR}/chunked")"
          podman untag "$IMAGE:testing" || true
          podman tag "$CHUNKED_IMAGE" "$IMAGE:testing" "$DTAG"

      - name: Push testing image
        run: |
          IMAGE="${IMAGE,,}"
          podman push --digestfile=/tmp/digestfile "$IMAGE:testing"
          podman push --digestfile=/tmp/digestfile "$DTAG"

      - name: Install Cosign
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Log in to GHCR (docker client, for cosign)
        # cosign uses its own credential chain (~/.docker/config.json), NOT
        # podman's authfile — without this the signature upload gets UNAUTHORIZED.
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sign testing image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          IMAGE="${IMAGE,,}"
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$IMAGE@$(cat /tmp/digestfile)"

  build-final:
    if: needs.changes.outputs.final == 'true' || github.event_name == 'schedule' || github.event.inputs.final == 'true'
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        run: |
          IMAGE="${IMAGE,,}"
          echo "${{ secrets.GHCR_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build final image
        run: |
          IMAGE="${IMAGE,,}"
          # --pull=newer re-checks the base manifest each build (this is what
          # makes the weekly schedule pick up Fedora package/base updates).
          podman build --pull=newer -t "$IMAGE:stable" -t "$IMAGE:latest" .
          # Immutable rollback anchor: stable-<UTC date>-<commit sha7>.
          echo "DTAG=$IMAGE:stable-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Rechunk image (small delta updates)
        run: |
          set -euox pipefail
          IMAGE="${IMAGE,,}"
          CHUNKAH_CONFIG_FILE="$(mktemp)"
          CHUNKAH_OUTPUT_DIR="$(mktemp -d "${WORKSPACE:-/tmp}"/zen-bootc-chunkah-XXXXXX)"

          # stable and latest point at the same local image; rechunk once and retag
          podman inspect "$IMAGE:stable" > "$CHUNKAH_CONFIG_FILE"
          podman run --rm \
            --mount=type=image,src="$IMAGE:stable",target=/chunkah \
            -v "$CHUNKAH_CONFIG_FILE:/chunkah-config.json:ro,Z" \
            -v "$CHUNKAH_OUTPUT_DIR:/run/out:Z" \
            "$RECHUNK_IMAGE" \
            build \
            --verbose \
            --compressed \
            --max-layers 128 \
            --prune /sysroot/ \
            --label ostree.commit- --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          CHUNKED_IMAGE="$(podman pull "oci:${CHUNKAH_OUTPUT_DIR}/chunked")"
          podman untag "$IMAGE:stable" || true
          podman tag "$CHUNKED_IMAGE" "$IMAGE:stable" "$IMAGE:latest" "$DTAG"

      - name: Push final image
        run: |
          IMAGE="${IMAGE,,}"
          podman push --digestfile=/tmp/digestfile "$IMAGE:stable"
          podman push --digestfile=/tmp/digestfile "$IMAGE:latest"
          podman push --digestfile=/tmp/digestfile "$DTAG"

      - name: Install Cosign
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Log in to GHCR (docker client, for cosign)
        # cosign uses its own credential chain (~/.docker/config.json), NOT
        # podman's authfile — without this the signature upload gets UNAUTHORIZED.
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sign final image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          IMAGE="${IMAGE,,}"
          # stable and latest resolve to the same digest; one signature covers both
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$IMAGE@$(cat /tmp/digestfile)"
