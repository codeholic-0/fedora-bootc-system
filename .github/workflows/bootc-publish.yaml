name: Build and Push Fedora Bootc

on:
  push:
    branches: [main]
    paths:
      - "Containerfile"
      - "Containerfile.testing"
      - "Containerfile.minimal"
      - "policy.json"
      - ".github/workflows/bootc-publish.yaml"
  # Weekly rebuild: tracks Fedora 45 package/base updates without any commits.
  # 18:05 UTC Saturday (off-peak offset from the hour).
  schedule:
    - cron: "5 18 * * 6"
  workflow_dispatch:
    inputs:
      minimal:
        description: "Build minimal"
        type: boolean
        default: false
      testing:
        description: "Build testing"
        type: boolean
        default: false
      final:
        description: "Build final"
        type: boolean
        default: false
      dev:
        description: "Build dev"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/zen-bootc
  # Distro-agnostic rechunker; pinned by digest, bump deliberately.
  RECHUNK_IMAGE: quay.io/coreos/chunkah@sha256:71e593421c5de7dcc7c8c5c50e98d3bac572055a76f399f61a491d123c20a523

# Superseded runs die.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Scheduled builds build everything; push/dispatch filter by paths.
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      minimal: ${{ steps.filter.outputs.minimal }}
      testing: ${{ steps.filter.outputs.testing }}
      final: ${{ steps.filter.outputs.final }}
      dev: ${{ steps.filter.outputs.dev }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed Containerfiles
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            minimal:
              - 'Containerfile.minimal'
            testing:
              - 'Containerfile.testing'
              - 'files/**'
              - '!files/home/**'   # user-local tooling (zen-dev) is not baked
            final:
              - 'Containerfile'
              - 'policy.json'
              - 'files/**'
              - '!files/home/**'
              - '.github/workflows/bootc-publish.yaml'
            # dev tracks stable: stable inputs rebuild dev so its base
            # never lags the promotion. zen-dev changes ride here too —
            # the dev job's fetch check validates the raw URL.
            dev:
              - 'Containerfile.dev'
              - 'Containerfile'
              - 'policy.json'
              - 'files/**'
              - '.github/workflows/bootc-publish.yaml'

  # One matrix job for all three flavors; per-flavor logic is matrix data.
  build:
    name: Build ${{ matrix.flavor.role }}
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - role: minimal
            dockerfile: Containerfile.minimal
            tag: minimal-latest
            dtag_prefix: minimal
            extra_tags: ""
            smoke: 'false'
          - role: testing
            dockerfile: Containerfile.testing
            tag: testing
            dtag_prefix: testing
            extra_tags: ""
            smoke: 'true'
          - role: final
            dockerfile: Containerfile
            tag: stable
            dtag_prefix: stable
            # stable and latest are the same image; one extra ref, not an extra build
            extra_tags: "latest"
            smoke: 'true'
    steps:
      - name: Decide whether to run
        # Job-level `if` can't see matrix context: the gate lives in a step
        # and runs FIRST so skipped flavors pay for nothing.
        id: gate
        env:
          ROLE: ${{ matrix.flavor.role }}
          CH_MINIMAL: ${{ needs.changes.outputs.minimal }}
          CH_TESTING: ${{ needs.changes.outputs.testing }}
          CH_FINAL: ${{ needs.changes.outputs.final }}
          IN_MINIMAL: ${{ github.event.inputs.minimal }}
          IN_TESTING: ${{ github.event.inputs.testing }}
          IN_FINAL: ${{ github.event.inputs.final }}
        run: |
          CHANGED_VAR="CH_${ROLE^^}"
          IN_VAR="IN_${ROLE^^}"
          CHANGED="${!CHANGED_VAR}"
          TOGGLED="${!IN_VAR}"
          case "${GITHUB_EVENT_NAME}" in
            schedule)          SHOULD_RUN=true ;;
            push)              [[ "${CHANGED}" == "true" ]] && SHOULD_RUN=true ;;
            workflow_dispatch) [[ "${TOGGLED}" == "true" ]] && SHOULD_RUN=true ;;
          esac
          echo "SHOULD_RUN=${SHOULD_RUN:-false}" >> "$GITHUB_ENV"

      - name: Maximize build space
        # Rechunking copies the full image; prune the runner first.
        if: env.SHOULD_RUN == 'true'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout code
        if: env.SHOULD_RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install podman
        if: env.SHOULD_RUN == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        # Built-in GITHUB_TOKEN, no PAT.
        if: env.SHOULD_RUN == 'true'
        run: |
          IMAGE="${IMAGE,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        if: env.SHOULD_RUN == 'true'
        env:
          DOCKERFILE: ${{ matrix.flavor.dockerfile }}
          TAG: ${{ matrix.flavor.tag }}
          EXTRA_TAGS: ${{ matrix.flavor.extra_tags }}
        run: |
          IMAGE="${IMAGE,,}"
          # --pull=newer is what makes the weekly schedule track base updates.
          TAG_ARGS=()
          for extra in ${EXTRA_TAGS}; do
            TAG_ARGS+=(-t "$IMAGE:$extra")
          done
          podman build --pull=newer -f "$DOCKERFILE" -t "$IMAGE:$TAG" "${TAG_ARGS[@]}" .
          # Immutable rollback anchor: <prefix>-<UTC date>-<commit sha7>.
          echo "DTAG=$IMAGE:${{ matrix.flavor.dtag_prefix }}-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Smoke-check image
        # Runs the assembled image (the artifact that gets pushed+signed) and
        # asserts invariants before rechunk: branding, zen-ctl wiring,
        # signature policy, shipped files. minimal excluded (stagnant flavor).
        if: env.SHOULD_RUN == 'true' && matrix.flavor.smoke == 'true'
        env:
          TAG: ${{ matrix.flavor.tag }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          podman run --rm "$IMAGE:$TAG" /bin/bash -c '
            set -euo pipefail
            grep -q "^NAME=\"ZenC OS\"" /etc/os-release
            grep -q "^PRETTY_NAME=\"ZenC OS 45\"" /usr/lib/os-release
            [ "$(readlink /etc/os-release)" = "../usr/lib/os-release" ]
            bash -n /usr/local/bin/zen-ctl
            command -v bootc jq
            grep -q sigstoreSigned /etc/containers/policy.json
            [ -f /usr/share/containers/cosign.pub ]
            [ -f /etc/cron.d/zen-ctl ]
            grep -q "^g docker" /usr/lib/sysusers.d/zen-bootc.conf
          '

      - name: zen-dev fetch check (user-local, not baked)
        # zen-dev lives in $HOME, not the image; CI validates the raw URL
        # parses. Cheap; repeats per leg when the matrix runs multiple.
        if: env.SHOULD_RUN == 'true' && matrix.flavor.smoke == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/codeholic-0/zen-bootc/main/files/home/.local/bin/zen-dev | bash -n
          echo "zen-dev raw fetch parses OK"

      - name: Rechunk image (small delta updates)
        if: env.SHOULD_RUN == 'true'
        env:
          TAG: ${{ matrix.flavor.tag }}
          EXTRA_TAGS: ${{ matrix.flavor.extra_tags }}
        run: |
          set -euox pipefail
          IMAGE="${IMAGE,,}"
          CHUNKAH_CONFIG_FILE="$(mktemp)"
          CHUNKAH_OUTPUT_DIR="$(mktemp -d "${WORKSPACE:-/tmp}"/zen-bootc-chunkah-XXXXXX)"
          podman inspect "$IMAGE:$TAG" > "$CHUNKAH_CONFIG_FILE"

          podman run --rm \
            --mount=type=image,src="$IMAGE:$TAG",target=/chunkah \
            -v "$CHUNKAH_CONFIG_FILE:/chunkah-config.json:ro,Z" \
            -v "$CHUNKAH_OUTPUT_DIR:/run/out:Z" \
            "$RECHUNK_IMAGE" \
            build \
            --verbose \
            --compressed \
            --max-layers 128 \
            --prune /sysroot/ \
            --label ostree.commit- --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          # Re-point ALL local tags onto the chunked image
          CHUNKED_IMAGE="$(podman pull "oci:${CHUNKAH_OUTPUT_DIR}/chunked")"
          podman untag "$IMAGE:$TAG" || true
          TAG_CHUNKED=("$IMAGE:$TAG" "$DTAG")
          for extra in ${EXTRA_TAGS}; do
            TAG_CHUNKED+=("$IMAGE:$extra")
          done
          podman tag "$CHUNKED_IMAGE" "${TAG_CHUNKED[@]}"

      - name: Push image
        if: env.SHOULD_RUN == 'true'
        env:
          TAG: ${{ matrix.flavor.tag }}
          EXTRA_TAGS: ${{ matrix.flavor.extra_tags }}
        run: |
          IMAGE="${IMAGE,,}"
          REFS="$IMAGE:$TAG"
          for extra in ${EXTRA_TAGS}; do REFS="$REFS $IMAGE:$extra"; done
          REFS="$REFS $DTAG"
          for ref in $REFS; do
            # First push uploads fresh blobs but DROPS chunkah layer
            # annotations (podman #27796) -> digest differs. The second push
            # converges every ref onto the annotated digest; sign THAT.
            podman push "$ref"
            podman push --digestfile=/tmp/digestfile "$ref"
          done

      - name: Install Cosign
        if: env.SHOULD_RUN == 'true' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Log in to GHCR (docker client, for cosign)
        # cosign uses its own credential chain, not podman's authfile.
        if: env.SHOULD_RUN == 'true' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sign image
        if: env.SHOULD_RUN == 'true' && github.ref == 'refs/heads/main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          IMAGE="${IMAGE,,}"
          # Sign the pushed digest; every tag sharing it is covered.
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$IMAGE@$(cat /tmp/digestfile)"

      - name: Verify signature (self-check)
        # Verify BY TAG: the tag's registry digest must be the signed one
        # (podman #27796 class of divergence). No Rekor entry on key-based
        # signs, hence --insecure-ignore-tlog.
        if: env.SHOULD_RUN == 'true' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ matrix.flavor.tag }}
          EXTRA_TAGS: ${{ matrix.flavor.extra_tags }}
        run: |
          IMAGE="${IMAGE,,}"
          REFS="$IMAGE:$TAG"
          for extra in ${EXTRA_TAGS}; do REFS="$REFS $IMAGE:$extra"; done
          REFS="$REFS $DTAG"
          for ref in $REFS; do
            cosign verify --key cosign.pub --insecure-ignore-tlog "$ref"
          done

  # Dev flavor builds AFTER the matrix job: Containerfile.dev FROMs the
  # pushed :stable tag, so the fresh promotion must be in the registry
  # before this runs.
  dev:
    name: Build dev
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Decide whether to run
        id: gate
        env:
          CHANGED: ${{ needs.changes.outputs.dev }}
          TOGGLED: ${{ github.event.inputs.dev }}
        run: |
          case "${GITHUB_EVENT_NAME}" in
            schedule)          SHOULD_RUN=true ;;
            push)              [[ "${CHANGED}" == "true" ]] && SHOULD_RUN=true ;;
            workflow_dispatch) [[ "${TOGGLED}" == "true" ]] && SHOULD_RUN=true ;;
          esac
          echo "SHOULD_RUN=${SHOULD_RUN:-false}" >> "$GITHUB_ENV"

      - name: Maximize build space
        if: env.SHOULD_RUN == 'true'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout code
        if: env.SHOULD_RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install podman
        if: env.SHOULD_RUN == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        if: env.SHOULD_RUN == 'true'
        run: |
          IMAGE="${IMAGE,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        if: env.SHOULD_RUN == 'true'
        run: |
          IMAGE="${IMAGE,,}"
          # Base tag is the just-pushed :stable (see job comment).
          podman build --pull=newer -f Containerfile.dev -t "$IMAGE:dev" .
          echo "DTAG=$IMAGE:dev-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Smoke-check image
        # Base asserts (inherited from :stable) + the dev layer: toolchain,
        # VSCodium. zen-dev is NOT baked (user-local on all flavors).
        if: env.SHOULD_RUN == 'true'
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          podman run --rm "$IMAGE:dev" /bin/bash -c '
            set -euo pipefail
            grep -q "^NAME=\"ZenC OS\"" /etc/os-release
            grep -q "^PRETTY_NAME=\"ZenC OS 45\"" /usr/lib/os-release
            [ "$(readlink /etc/os-release)" = "../usr/lib/os-release" ]
            bash -n /usr/local/bin/zen-ctl
            command -v bootc jq gcc make cmake python3 codium
            grep -q sigstoreSigned /etc/containers/policy.json
            [ -f /usr/share/containers/cosign.pub ]
            [ -f /etc/cron.d/zen-ctl ]
            grep -q "^g docker" /usr/lib/sysusers.d/zen-bootc.conf
            grep -q vscodium /etc/yum.repos.d/vscodium.repo
          '

      - name: zen-dev fetch check (user-local, not baked)
        if: env.SHOULD_RUN == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/codeholic-0/zen-bootc/main/files/home/.local/bin/zen-dev | bash -n
          echo "zen-dev raw fetch parses OK"

      - name: Rechunk image (small delta updates)
        if: env.SHOULD_RUN == 'true'
        run: |
          set -euox pipefail
          IMAGE="${IMAGE,,}"
          CHUNKAH_CONFIG_FILE="$(mktemp)"
          CHUNKAH_OUTPUT_DIR="$(mktemp -d "${WORKSPACE:-/tmp}"/zen-bootc-chunkah-XXXXXX)"
          podman inspect "$IMAGE:dev" > "$CHUNKAH_CONFIG_FILE"

          podman run --rm \
            --mount=type=image,src="$IMAGE:dev",target=/chunkah \
            -v "$CHUNKAH_CONFIG_FILE:/chunkah-config.json:ro,Z" \
            -v "$CHUNKAH_OUTPUT_DIR:/run/out:Z" \
            "$RECHUNK_IMAGE" \
            build \
            --verbose \
            --compressed \
            --max-layers 128 \
            --prune /sysroot/ \
            --label ostree.commit- --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          CHUNKED_IMAGE="$(podman pull "oci:${CHUNKAH_OUTPUT_DIR}/chunked")"
          podman untag "$IMAGE:dev" || true
          podman tag "$CHUNKED_IMAGE" "$IMAGE:dev" "$DTAG"

      - name: Push image
        if: env.SHOULD_RUN == 'true'
        run: |
          IMAGE="${IMAGE,,}"
          for ref in "$IMAGE:dev" "$DTAG"; do
            podman push "$ref"
            podman push --digestfile=/tmp/digestfile "$ref"
          done

      - name: Install Cosign
        if: env.SHOULD_RUN == 'true' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Log in to GHCR (docker client, for cosign)
        if: env.SHOULD_RUN == 'true' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sign image
        if: env.SHOULD_RUN == 'true' && github.ref == 'refs/heads/main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          IMAGE="${IMAGE,,}"
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$IMAGE@$(cat /tmp/digestfile)"

      - name: Verify signature (self-check)
        if: env.SHOULD_RUN == 'true' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${IMAGE,,}"
          for ref in "$IMAGE:dev" "$DTAG"; do
            cosign verify --key cosign.pub --insecure-ignore-tlog "$ref"
          done
