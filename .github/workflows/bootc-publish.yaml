name: Build and Push Fedora Bootc

on:
  push:
    branches: [main]
    paths:
      - "Containerfile"
      - "Containerfile.testing"
      - "Containerfile.minimal"
      - "policy.json"
      - ".github/workflows/bootc-publish.yaml"
  # Weekly rebuild: tracks Fedora 45 package/base updates without any commits.
  # 18:05 UTC Saturday (off-peak offset from the hour).
  schedule:
    - cron: "5 18 * * 6"
  workflow_dispatch:
    inputs:
      minimal:
        description: "Build minimal"
        type: boolean
        default: false
      testing:
        description: "Build testing"
        type: boolean
        default: false
      final:
        description: "Build final"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/zen-bootc
  # Distro-agnostic rechunker (coreos/chunkah). Alternative (needs rpm-ostree
  # inside the image): rpm-ostree compose build-chunked-oci --bootc.
  # Pinned by digest (template pattern: "pin once mature") so an upstream
  # repush of :latest can't break the rechunk step. Bump deliberately.
  RECHUNK_IMAGE: quay.io/coreos/chunkah@sha256:71e593421c5de7dcc7c8c5c50e98d3bac572055a76f399f61a491d123c20a523

# Cancel superseded runs of this workflow on the same branch to avoid
# burning build+push minutes on outdated commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Scheduled runs always build everything; push/dispatch filter by paths.
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      minimal: ${{ steps.filter.outputs.minimal }}
      testing: ${{ steps.filter.outputs.testing }}
      final: ${{ steps.filter.outputs.final }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Detect changed Containerfiles
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            minimal:
              - 'Containerfile.minimal'
            testing:
              - 'Containerfile.testing'
            final:
              - 'Containerfile'
              - 'policy.json'
              - '.github/workflows/bootc-publish.yaml'

  # One job body for all three flavors (matrix), following the ublue/bluefin
  # "reusable build" pattern scaled to a single image. Flavor-specific logic
  # is data (matrix fields), not duplicated YAML.
  build:
    name: Build ${{ matrix.flavor.role }}
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - role: minimal
            dockerfile: Containerfile.minimal
            tag: minimal-latest
            dtag_prefix: minimal
            extra_tags: ""
          - role: testing
            dockerfile: Containerfile.testing
            tag: testing
            dtag_prefix: testing
            extra_tags: ""
          - role: final
            dockerfile: Containerfile
            tag: stable
            dtag_prefix: stable
            # stable and latest are the same image; one extra ref, not an extra build
            extra_tags: "latest"
    steps:
      - name: Decide whether to run
        # Job-level `if` cannot use the matrix context, so the per-flavor gate
        # lives in a step instead — and MUST be the first step so skipped
        # flavors don't pay for pruning/checkout/podman-install. Needs only
        # needs.changes outputs + event context; no checkout required.
        id: gate
        env:
          ROLE: ${{ matrix.flavor.role }}
          CH_MINIMAL: ${{ needs.changes.outputs.minimal }}
          CH_TESTING: ${{ needs.changes.outputs.testing }}
          CH_FINAL: ${{ needs.changes.outputs.final }}
          IN_MINIMAL: ${{ github.event.inputs.minimal }}
          IN_TESTING: ${{ github.event.inputs.testing }}
          IN_FINAL: ${{ github.event.inputs.final }}
        run: |
          CHANGED_VAR="CH_${ROLE^^}"
          IN_VAR="IN_${ROLE^^}"
          CHANGED="${!CHANGED_VAR}"
          TOGGLED="${!IN_VAR}"
          case "${GITHUB_EVENT_NAME}" in
            schedule)          SHOULD_RUN=true ;;
            push)              [[ "${CHANGED}" == "true" ]] && SHOULD_RUN=true ;;
            workflow_dispatch) [[ "${TOGGLED}" == "true" ]] && SHOULD_RUN=true ;;
          esac
          echo "SHOULD_RUN=${SHOULD_RUN:-false}" >> "$GITHUB_ENV"

      - name: Maximize build space
        # Rechunking makes a full copy of the image; the ~10GB images need the
        # runner pruned first (same recipe the ublue templates use).
        if: env.SHOULD_RUN == 'true'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout code
        if: env.SHOULD_RUN == 'true'
        uses: actions/checkout@v5

      - name: Install podman
        if: env.SHOULD_RUN == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        # Built-in GITHUB_TOKEN (job's packages:write scope) — no PAT needed.
        if: env.SHOULD_RUN == 'true'
        run: |
          IMAGE="${IMAGE,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        if: env.SHOULD_RUN == 'true'
        env:
          DOCKERFILE: ${{ matrix.flavor.dockerfile }}
          TAG: ${{ matrix.flavor.tag }}
          EXTRA_TAGS: ${{ matrix.flavor.extra_tags }}
        run: |
          IMAGE="${IMAGE,,}"
          # --pull=newer re-checks the base manifest each build (this is what
          # makes the weekly schedule pick up Fedora package/base updates).
          TAG_ARGS=()
          for extra in ${EXTRA_TAGS}; do
            TAG_ARGS+=(-t "$IMAGE:$extra")
          done
          podman build --pull=newer -f "$DOCKERFILE" -t "$IMAGE:$TAG" "${TAG_ARGS[@]}" .
          # Immutable rollback anchor: <prefix>-<UTC date>-<commit sha7>.
          echo "DTAG=$IMAGE:${{ matrix.flavor.dtag_prefix }}-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Rechunk image (small delta updates)
        if: env.SHOULD_RUN == 'true'
        env:
          TAG: ${{ matrix.flavor.tag }}
          EXTRA_TAGS: ${{ matrix.flavor.extra_tags }}
        run: |
          set -euox pipefail
          IMAGE="${IMAGE,,}"
          CHUNKAH_CONFIG_FILE="$(mktemp)"
          CHUNKAH_OUTPUT_DIR="$(mktemp -d "${WORKSPACE:-/tmp}"/zen-bootc-chunkah-XXXXXX)"
          podman inspect "$IMAGE:$TAG" > "$CHUNKAH_CONFIG_FILE"

          podman run --rm \
            --mount=type=image,src="$IMAGE:$TAG",target=/chunkah \
            -v "$CHUNKAH_CONFIG_FILE:/chunkah-config.json:ro,Z" \
            -v "$CHUNKAH_OUTPUT_DIR:/run/out:Z" \
            "$RECHUNK_IMAGE" \
            build \
            --verbose \
            --compressed \
            --max-layers 128 \
            --prune /sysroot/ \
            --label ostree.commit- --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          # Re-point ALL local tags onto the chunked image
          CHUNKED_IMAGE="$(podman pull "oci:${CHUNKAH_OUTPUT_DIR}/chunked")"
          podman untag "$IMAGE:$TAG" || true
          TAG_CHUNKED=("$IMAGE:$TAG" "$DTAG")
          for extra in ${EXTRA_TAGS}; do
            TAG_CHUNKED+=("$IMAGE:$extra")
          done
          podman tag "$CHUNKED_IMAGE" "${TAG_CHUNKED[@]}"

      - name: Push image
        if: env.SHOULD_RUN == 'true'
        env:
          TAG: ${{ matrix.flavor.tag }}
          EXTRA_TAGS: ${{ matrix.flavor.extra_tags }}
        run: |
          IMAGE="${IMAGE,,}"
          # Same manifest under every ref; only the first push uploads layers.
          podman push --digestfile=/tmp/digestfile "$IMAGE:$TAG"
          for extra in ${EXTRA_TAGS}; do
            podman push --digestfile=/tmp/digestfile-extra "$IMAGE:$extra"
          done
          podman push --digestfile=/tmp/digestfile "$DTAG"

      - name: Install Cosign
        if: env.SHOULD_RUN == 'true' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Log in to GHCR (docker client, for cosign)
        # cosign uses its own credential chain (~/.docker/config.json), NOT
        # podman's authfile — without this the signature upload gets UNAUTHORIZED.
        if: env.SHOULD_RUN == 'true' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sign image
        if: env.SHOULD_RUN == 'true' && github.ref == 'refs/heads/main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          IMAGE="${IMAGE,,}"
          # Key-based signing is done against the pushed digest, not the tag.
          # One signature on the digest covers every tag sharing it.
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$IMAGE@$(cat /tmp/digestfile)"

      - name: Verify signature (self-check)
        # Close the loop: prove the digest we just pushed is verifiable with
        # the committed public key, instead of trusting sign exit code.
        if: env.SHOULD_RUN == 'true' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${IMAGE,,}"
          cosign verify --key cosign.pub \
            --new-bundle-format=false --use-signing-config=false \
            "$IMAGE@$(cat /tmp/digestfile)"
