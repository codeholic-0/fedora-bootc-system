name: Build and Push Fedora Bootc

on:
  push:
    branches: [ main ]
    paths:
      - 'Containerfile'
  workflow_dispatch:

jobs:
  publish-bootc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/fedora-kde-bootc:latest"
          IMAGE="${IMAGE,,}"
          echo "${{ secrets.GHCR_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Bootc Image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/fedora-kde-bootc:latest"
          IMAGE="${IMAGE,,}"
          podman build -t "$IMAGE" .

      - name: Push Bootc Image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/fedora-kde-bootc:latest"
          IMAGE="${IMAGE,,}"
          podman push "$IMAGE"