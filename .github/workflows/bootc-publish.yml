name: Build and Push Fedora Bootc

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "Containerfile"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/fedora-kde-bootc

jobs:
  build-testing:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        run: |
          IMAGE="${IMAGE,,}"
          echo "${{ secrets.GHCR_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Bootc Image
        run: |
          IMAGE="${IMAGE,,}"
          podman build -t "$IMAGE:testing" -t "$IMAGE:latest" .

      - name: Push Bootc Image
        run: |
          IMAGE="${IMAGE,,}"
          podman push "$IMAGE:testing"
          podman push "$IMAGE:latest"

  promote-stable:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: promote-stable
      cancel-in-progress: false

    steps:
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        run: |
          IMAGE="${IMAGE,,}"
          echo "${{ secrets.GHCR_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Promote testing to stable
        run: |
          IMAGE="${IMAGE,,}"
          DIGEST=$(podman pull --quiet "$IMAGE:testing")
          podman tag "$DIGEST" "$IMAGE:stable" "$IMAGE:${{ github.ref_name }}"
          podman push "$IMAGE:stable"
          podman push "$IMAGE:${{ github.ref_name }}"

      - name: Show promoted digests
        run: |
          IMAGE="${IMAGE,,}"
          podman inspect --format '{{ .From.Image }}' "${IMAGE,,}:stable"
