name: Publish Testing ISO

# ISO build + SourceForge publication, in its own file to keep
# bootc-publish.yaml (image building) scannable. MANUAL TRIGGER ONLY
# (workflow_dispatch): deliberately NOT chained to the image workflow — a
# workflow_run chain would fire on every main-branch image run (including
# targeted minimal/final dispatch builds), building ISOs nobody asked for.
# Run this when you deliberately want a fresh ISO; it always cosign-verifies
# the current :testing tag first, so a manual build is against the last
# published image.

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/zen-bootc
  SF_PROJECT: fedora-bootc-system

# Workflow-level concurrency: superseded ISO presses cancel.
concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Uses the legacy bootc-image-builder (anaconda-iso) flow — see docs/iso.md
  # for the full history of why (image-builder generic-iso path failed in VM).
  build-iso:
    name: Build & publish testing ISO
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set provenance sha
        env:
          SHA0: ${{ github.sha }}
        run: echo "SHA=${SHA0}" >> "$GITHUB_ENV"

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Verify :testing signature BEFORE building
        # Refuse to burn ~1h of runner — and refuse to publish an installer —
        # on a :testing image our own key didn't sign. cosign reads the
        # registry directly; the image is public, no pull/login needed.
        run: |
          IMAGE="${IMAGE,,}"
          cosign verify --key cosign.pub --insecure-ignore-tlog "$IMAGE:testing" \
            > /tmp/verify-out.json
          echo "Signature OK: $(jq -r '.[0].critical.image."docker-manifest-digest"' /tmp/verify-out.json)"

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman rsync

      - name: Build ISO
        # Legacy bootc-image-builder one-command flow (docs/iso.md). GH
        # runners have no /dev/kvm — BIB falls back to qemu-TCG, so this step
        # is SLOW (~45-90min). Keep the container unpinned for now; pin by
        # digest once this has survived a weekly cycle.
        run: |
          IMAGE="${IMAGE,,}"
          sudo podman run --rm --privileged \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/disk_config/iso-kde.toml:/config.toml:ro" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --rootfs ext4 --type anaconda-iso \
            "$IMAGE:testing"

      - name: Provenance rename + checksum
        # <name>-<UTC date>-<commit sha7> — sha is the commit the image
        # workflow last ran on (workflow_run carries it; fallback == checkout).
        run: |
          set -euo pipefail
          ISO_NAME="zen-bootc-testing-$(date -u +%Y%m%d)-${SHA:0:7}.iso"
          mv output/bootiso/install.iso "output/$ISO_NAME"
          ( cd output && sha256sum "$ISO_NAME" | tee sha256sums.txt )
          echo "ISO_NAME=$ISO_NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}
          path: |
            output/${{ env.ISO_NAME }}
            output/sha256sums.txt
          retention-days: 3

      - name: Pin SourceForge host key (verify, don't trust)
        # Pin frs.sourceforge.net by the fingerprints SourceForge publishes
        # (sourceforge.net/p/forge/documentation/SSH%20Key%20Fingerprints/),
        # verified against a live keyscan — NOT accept-new/TOFU.
        run: |
          set -euo pipefail
          ssh-keyscan -t ed25519,rsa frs.sourceforge.net > /tmp/sf_known_hosts
          KEYS=$(ssh-keygen -lf /tmp/sf_known_hosts)
          echo "$KEYS"
          grep -q 'SHA256:209BDmH3jsRyO9UeGPPgLWPSegKmYCBIya0nR/AWWCY' <<<"$KEYS" || { echo "ED25519 fingerprint mismatch"; exit 1; }
          grep -q 'SHA256:xB2rnn0NUjZ/E0IXQp4gyPqc7U7gjcw7G26RhkDyk90' <<<"$KEYS" || { echo "RSA fingerprint mismatch"; exit 1; }

      - name: Publish ISO to SourceForge
        env:
          SF_KEY: ${{ secrets.SF_SSH_PRIVATE_KEY }}
          SF_USER: ${{ secrets.SF_USERNAME }}
        run: |
          set -euo pipefail
          PKT=$(mktemp); install -m 600 /dev/null "$PKT"; printf '%s\n' "$SF_KEY" > "$PKT"
          SSHOPTS="ssh -i $PKT -o IdentitiesOnly=yes -o UserKnownHostsFile=/tmp/sf_known_hosts -o StrictHostKeyChecking=yes"
          DATE_DIR="$(date -u +%Y-%m-%d)"
          rsync -av --mkpath -e "$SSHOPTS" \
            output/"$ISO_NAME" output/sha256sums.txt \
            "$SF_USER@frs.sourceforge.net:/home/frs/project/$SF_PROJECT/$DATE_DIR/"
          rm -f "$PKT"
          echo "SF_DATE_DIR=$DATE_DIR" >> "$GITHUB_ENV"
          echo "ISO_URL=https://sourceforge.net/projects/$SF_PROJECT/files/$DATE_DIR/$ISO_NAME/download" >> "$GITHUB_ENV"

      - name: Verify publication (self-check)
        # Same discipline as the cosign self-check: prove the file LANDED.
        env:
          SF_KEY: ${{ secrets.SF_SSH_PRIVATE_KEY }}
          SF_USER: ${{ secrets.SF_USERNAME }}
        run: |
          set -euo pipefail
          PKT=$(mktemp); install -m 600 /dev/null "$PKT"; printf '%s\n' "$SF_KEY" > "$PKT"
          SSHOPTS="ssh -i $PKT -o IdentitiesOnly=yes -o UserKnownHostsFile=/tmp/sf_known_hosts -o StrictHostKeyChecking=yes"
          $SSHOPTS "$SF_USER@frs.sourceforge.net" \
            "ls -la /home/frs/project/$SF_PROJECT/$SF_DATE_DIR/" | tee listing.txt
          grep -q "$ISO_NAME" listing.txt || { echo "ISO not visible on frs"; exit 1; }
          rm -f "$PKT"
          {
            echo "## ISO published"
            echo ""
            echo "- File: \`$ISO_NAME\`"
            echo "- Size: $(du -h "output/$ISO_NAME" | cut -f1)"
            echo "- URL: $ISO_URL"
          } >> "$GITHUB_STEP_SUMMARY"
