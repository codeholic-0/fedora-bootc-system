name: Publish ISO

# Manual-only ISO build + SourceForge publish. Role selectable via dispatch
# input (default testing). See docs/iso.md.

on:
  workflow_dispatch:
    inputs:
      role:
        description: "Image role the ISO installs (bootc-switch target)"
        type: choice
        options: [testing, stable]
        default: testing

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/zen-bootc
  SF_PROJECT: zen-bootc

# Superseded manual runs cancel.
concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Legacy bootc-image-builder (anaconda-iso) flow; docs/iso.md.
  build-iso:
    name: Build & publish ${{ inputs.role }} ISO
    # 26.04 runners load bwrap-userns-restrict (AppArmor): osbuild's sandbox
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Set provenance sha + role
        env:
          SHA0: ${{ github.sha }}
          ROLE0: ${{ inputs.role }}
        run: |
          echo "SHA=${SHA0}" >> "$GITHUB_ENV"
          echo "ROLE=${ROLE0}" >> "$GITHUB_ENV"

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Verify :${{ inputs.role }} signature BEFORE building
        # Don't publish an installer for an unsigned role image.
        run: |
          IMAGE="${IMAGE,,}"
          cosign verify --key cosign.pub --insecure-ignore-tlog "$IMAGE:${ROLE}" \
            > /tmp/verify-out.json
          echo "Signature OK: $(jq -r '.[0].critical.image."docker-manifest-digest"' /tmp/verify-out.json)"

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman rsync

      - name: Build ISO
        # Kickstart target is generated per-role (BIB takes plain TOML only);
        # newer BIB doesn't auto-pull. 24.04 runners expose /dev/kvm — the
        # test ISO built in ~6 min, not the TCG slowness feared pre-kvm.
        run: |
          mkdir -p output
          IMAGE="${IMAGE,,}"
          sudo podman pull "$IMAGE:$ROLE"
          sed -i "s|zen-bootc:testing|zen-bootc:$ROLE|" disk_config/iso-kde.toml
          # BIB pinned by digest; refetch when bumping deliberately.
          sudo podman run --rm --privileged \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/disk_config/iso-kde.toml:/config.toml:ro" \
            quay.io/centos-bootc/bootc-image-builder@sha256:dab86ee6b46dcade411b37f4e70b07d93b6a06da0dbfec6fe89247a220e0d9f8 \
            --rootfs ext4 --type anaconda-iso \
            "$IMAGE:$ROLE"
          # BIB runs rootful; hand the artifacts back to the runner user.
          sudo chown -R "$(id -u):$(id -g)" output

      - name: Provenance rename + checksum
        # zen-bootc-<role>-<UTC date>-<sha7> (sha = dispatched head commit).
        # Sums file named per-ISO: same-day/same-role represses can't clobber
        # each other's checksums on SourceForge (frs rsync overwrites).
        run: |
          set -euo pipefail
          ISO_NAME="zen-bootc-${ROLE}-$(date -u +%Y%m%d)-${SHA:0:7}.iso"
          mv output/bootiso/install.iso "output/$ISO_NAME"
          ISO_HASH="$ISO_NAME.sha256"
          ( cd output && sha256sum "$ISO_NAME" | tee "$ISO_HASH" )
          echo "ISO_NAME=$ISO_NAME" >> "$GITHUB_ENV"
          echo "ISO_HASH=$ISO_HASH" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ISO_NAME }}
          path: |
            output/${{ env.ISO_NAME }}
            output/${{ env.ISO_HASH }}
          retention-days: 3

      - name: Pin SourceForge host key (verify, don't trust)
        # Fingerprints from sourceforge.net/p/forge/documentation/SSH%20Key%20Fingerprints/
        run: |
          set -euo pipefail
          ssh-keyscan -t ed25519,rsa frs.sourceforge.net > /tmp/sf_known_hosts
          KEYS=$(ssh-keygen -lf /tmp/sf_known_hosts)
          echo "$KEYS"
          grep -q 'SHA256:209BDmH3jsRyO9UeGPPgLWPSegKmYCBIya0nR/AWWCY' <<<"$KEYS" || { echo "ED25519 fingerprint mismatch"; exit 1; }
          grep -q 'SHA256:xB2rnn0NUjZ/E0IXQp4gyPqc7U7gjcw7G26RhkDyk90' <<<"$KEYS" || { echo "RSA fingerprint mismatch"; exit 1; }

      - name: Publish ISO to SourceForge
        env:
          SF_KEY: ${{ secrets.SF_SSH_PRIVATE_KEY }}
          SF_USER: ${{ secrets.SF_USERNAME }}
        run: |
          set -euo pipefail
          PKT=$(mktemp); install -m 600 /dev/null "$PKT"; printf '%s\n' "$SF_KEY" > "$PKT"
          SSHOPTS="ssh -i $PKT -o IdentitiesOnly=yes -o UserKnownHostsFile=/tmp/sf_known_hosts -o StrictHostKeyChecking=yes"
          DATE_DIR="$(date -u +%Y-%m-%d)"
          # frs is a restricted shell (rsync/sftp only): no ssh mkdir/ls.
          # rsync creates remote subdirs when they're part of the transfer.
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/$DATE_DIR"
          cp output/"$ISO_NAME" output/"$ISO_HASH" "$STAGE/$DATE_DIR/"
          rsync -av -e "$SSHOPTS" "$STAGE/$DATE_DIR" \
            "$SF_USER@frs.sourceforge.net:/home/frs/project/$SF_PROJECT/"
          rm -rf "$STAGE"
          echo "SF_DATE_DIR=$DATE_DIR" >> "$GITHUB_ENV"
          echo "ISO_URL=https://sourceforge.net/projects/$SF_PROJECT/files/$DATE_DIR/$ISO_NAME/download" >> "$GITHUB_ENV"

      - name: Verify publication (self-check)
        # Prove the file landed (as cosign self-check does for the image).
        # rsync --list-only stays inside the restricted-shell protocol.
        env:
          SF_KEY: ${{ secrets.SF_SSH_PRIVATE_KEY }}
          SF_USER: ${{ secrets.SF_USERNAME }}
        run: |
          set -euo pipefail
          PKT=$(mktemp); install -m 600 /dev/null "$PKT"; printf '%s\n' "$SF_KEY" > "$PKT"
          SSHOPTS="ssh -i $PKT -o IdentitiesOnly=yes -o UserKnownHostsFile=/tmp/sf_known_hosts -o StrictHostKeyChecking=yes"
          rsync -a --list-only -e "$SSHOPTS" \
            "$SF_USER@frs.sourceforge.net:/home/frs/project/$SF_PROJECT/$SF_DATE_DIR/" \
            | tee listing.txt
          grep -q "$ISO_NAME" listing.txt || { echo "ISO not visible on frs"; exit 1; }
          grep -q "$ISO_HASH" listing.txt || { echo "Checksum not visible on frs"; exit 1; }
          rm -f "$PKT"
          {
            echo "## ISO published"
            echo ""
            echo "- File: \`$ISO_NAME\`"
            echo "- Size: $(du -h "output/$ISO_NAME" | cut -f1)"
            echo "- URL: $ISO_URL"
            echo "- Checksum: \`$ISO_HASH\` (sha256sum -c, same dir)"
          } >> "$GITHUB_STEP_SUMMARY"
